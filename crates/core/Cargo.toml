[package]
name = "unidle-core"
description = "Simulation controller and platform adapter interface. No UI or Tauri dependency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jiff = "0.2.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS calls are made directly rather than through `keepawake` or `enigo` (ADR-0002, ADR-0003).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.13", features = ["screensaver", "xtest"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
