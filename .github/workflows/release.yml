name: Release

# Pushing a version tag builds unsigned installers into a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Checks the tag matches the app version and takes the release notes from CHANGELOG.md.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version in Cargo.toml
        # The landing page links to assets named with the Cargo.toml version, so a mismatched tag
        # would publish installers its download buttons cannot find.
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"; exit 1
          fi
      - id: notes
        name: Extract release notes from CHANGELOG.md
        run: |
          notes=$(awk -v h="## ${GITHUB_REF_NAME#v}" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no '## ${GITHUB_REF_NAME#v}' section"; exit 1
          fi
          {
            echo "notes<<UNIDLE_NOTES_EOF"
            echo "$notes"
            echo
            echo "Download from [the landing page](https://throughthewind.github.io/unidle/) or from the assets below."
            echo "UNIDLE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Unidle ${{ github.ref_name }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          args: ${{ matrix.args }}
