name: Site

# Builds site/ on every PR that touches it and deploys it to GitHub Pages from main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "Cargo.toml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          set -euo pipefail
          # The download links name release assets, which tauri-action versions from Cargo.toml.
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$version"
          mkdir _site
          cp -R site/. _site/
          sed -i "s/__VERSION__/$version/g" _site/index.html
          if grep -n "__VERSION__" _site/index.html; then echo "unreplaced version placeholder"; exit 1; fi
          echo "Built site for v$version"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
