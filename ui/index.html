<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidle</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div id="window" class="ub-window">
      <header class="ub-bar">
        <button id="back" class="as-ibtn bar-back" type="button" hidden>
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </span>
        </button>
        <!-- Empty on the main screen: the button is the window (design system). -->
        <h1 id="title" class="bar-title"></h1>
        <!-- Both open a page in the browser; the app makes no network request (SPEC NFR-2). -->
        <button id="check-updates" class="as-ibtn" type="button">
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v11" />
              <path d="M7 10l5 5 5-5" />
              <path d="M5 20h14" />
            </svg>
          </span>
        </button>
        <button id="open-website" class="as-ibtn" type="button" hidden>
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18" />
              <path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z" />
            </svg>
          </span>
        </button>
        <button id="open-settings" class="as-ibtn" type="button">
          <span>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </span>
        </button>
      </header>

      <main id="main-view" class="view main-view">
        <div class="ub-stage">
          <button id="power" class="ub-power" type="button" role="switch" aria-checked="false"></button>
        </div>
        <div class="ub-meta">
          <span id="state" class="ub-state"></span>
          <span id="timer" class="ub-timer"></span>
        </div>
        <!-- Who turned it on, and the next change (SPEC SC-4). -->
        <p id="detail" class="as-status detail-line" hidden>
          <span class="dot"></span>
          <span id="detail-text"></span>
        </p>
        <p id="status" class="as-status status-line" role="status" hidden>
          <span class="dot"></span>
          <span id="status-text"></span>
        </p>
        <button id="status-action" class="as-btn ghost status-action" type="button" hidden></button>
        <!-- Quick timers (SPEC SC-3). -->
        <div id="timers" class="timers" role="group"></div>
        <form id="until-form" class="timers until" hidden>
          <label id="l-until" class="until-label" for="until-time"></label>
          <input id="until-time" class="input until-time" type="time" required />
          <button id="until-start" class="as-btn primary" type="submit"></button>
          <button id="until-cancel" class="as-btn ghost" type="button"></button>
        </form>
      </main>

      <section id="settings-view" class="view settings" hidden>
        <div class="settings-scroll">
          <section class="group">
            <h2 id="h-appearance" class="group-title"></h2>
            <div class="field">
              <span id="l-style" class="field-label"></span>
              <div id="style-picker" class="as-seg seg" role="radiogroup" aria-labelledby="l-style"></div>
            </div>
            <div class="field">
              <span id="l-theme" class="field-label"></span>
              <div id="theme-picker" class="as-seg seg" role="radiogroup" aria-labelledby="l-theme"></div>
            </div>
            <label class="row">
              <span class="row-text">
                <span id="l-show-timers" class="row-label"></span>
                <span id="d-show-timers" class="row-hint"></span>
              </span>
              <input id="show-timers" class="switch" type="checkbox" role="switch" />
            </label>
            <div class="field">
              <span id="l-icon" class="field-label"></span>
              <div id="icon-picker" class="as-seg seg" role="radiogroup" aria-labelledby="l-icon" aria-describedby="d-icon"></div>
              <span id="d-icon" class="row-hint"></span>
            </div>
          </section>

          <section class="group">
            <h2 id="h-activity" class="group-title"></h2>
            <label class="row">
              <span class="row-text">
                <span id="l-nudge" class="row-label"></span>
                <span id="d-nudge" class="row-hint"></span>
              </span>
              <input id="nudge-enabled" class="switch" type="checkbox" role="switch" />
            </label>
            <div class="field" data-needs-nudge>
              <span id="l-method" class="field-label"></span>
              <div id="method-picker" class="as-seg seg" role="radiogroup" aria-labelledby="l-method"></div>
            </div>
            <label class="row" data-needs-nudge data-needs-key>
              <span id="l-key" class="row-label"></span>
              <span class="select">
                <select id="nudge-key" class="input"></select>
              </span>
            </label>
            <label class="row" data-needs-nudge>
              <span class="row-text">
                <span id="l-interval" class="row-label"></span>
                <span id="d-interval" class="row-hint"></span>
              </span>
              <span class="input-with-unit">
                <input id="nudge-interval" class="input input-number" type="number" min="10" max="600" step="1" />
                <span id="u-interval" class="unit"></span>
              </span>
            </label>
          </section>

          <section class="group">
            <h2 id="h-schedule" class="group-title"></h2>
            <label class="row">
              <span class="row-text">
                <span id="l-schedule" class="row-label"></span>
                <span id="d-schedule" class="row-hint"></span>
              </span>
              <input id="schedule-enabled" class="switch" type="checkbox" role="switch" />
            </label>
            <div id="schedule-body" class="schedule-body">
              <ul id="schedule-windows" class="windows"></ul>
              <button id="add-window" class="as-btn ghost add" type="button"></button>
              <div class="field">
                <span class="row-text">
                  <span id="l-skip" class="field-label"></span>
                  <span id="d-skip" class="row-hint"></span>
                </span>
                <ul id="skip-dates" class="skip-dates"></ul>
                <form id="skip-form" class="skip-form">
                  <input id="skip-date" class="input" type="date" required />
                  <button id="skip-add" class="as-btn secondary" type="submit"></button>
                </form>
              </div>
            </div>
            <!-- Outside the switch's reach: a schedule can be loaded before it is turned on. -->
            <div class="row">
              <span class="row-text">
                <span id="l-schedule-file" class="row-label"></span>
                <span id="d-schedule-file" class="row-hint"></span>
              </span>
              <span class="file-actions">
                <button id="schedule-import" class="as-btn secondary" type="button"></button>
                <button id="schedule-export" class="as-btn secondary" type="button"></button>
              </span>
            </div>
          </section>

          <section class="group">
            <h2 id="h-system" class="group-title"></h2>
            <label class="row">
              <span id="l-display" class="row-label"></span>
              <input id="keep-display-on" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="row">
              <span id="l-login" class="row-label"></span>
              <input id="launch-at-login" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="row">
              <span id="l-restore" class="row-label"></span>
              <input id="restore-last-state" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="row">
              <span class="row-text">
                <span id="l-tray-click" class="row-label"></span>
                <span id="d-tray-click" class="row-hint"></span>
              </span>
              <input id="tray-click-toggles" class="switch" type="checkbox" role="switch" />
            </label>
            <label class="row">
              <span id="l-notify" class="row-label"></span>
              <input id="notify-on-change" class="switch" type="checkbox" role="switch" />
            </label>
            <div class="row">
              <span class="row-text">
                <span id="l-shortcut" class="row-label"></span>
                <span id="d-shortcut" class="row-hint"></span>
              </span>
              <span class="shortcut">
                <button id="shortcut-record" class="as-btn secondary shortcut-key" type="button"></button>
                <button id="shortcut-clear" class="as-btn ghost" type="button"></button>
              </span>
            </div>
          </section>

          <p id="version" class="version"></p>
        </div>
        <p id="settings-error" class="as-status error" role="alert" hidden>
          <span class="dot"></span>
          <span id="settings-error-text"></span>
        </p>
      </section>
    </div>
  </body>
</html>
