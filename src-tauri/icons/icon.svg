<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Unidle app icon: the Halo power button, ON, on a graphite tile. Colors are design tokens (dark theme). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A211F"/>
      <stop offset="0.55" stop-color="#111614"/>
      <stop offset="1" stop-color="#07090A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="bloom" cx="512" cy="540" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3EF0A8" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3EF0A8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3EF0A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0.18" y1="0.1" x2="0.82" y2="0.95">
      <stop offset="0" stop-color="#3FE09F"/>
      <stop offset="0.4" stop-color="#34D697"/>
      <stop offset="1" stop-color="#119565"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.38" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0.7" stop-color="#04110B" stop-opacity="0"/>
      <stop offset="1" stop-color="#04110B" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tileclip"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <circle cx="512" cy="540" r="470" fill="url(#bloom)"/>
    <circle cx="512" cy="512" r="372" fill="none" stroke="#3EF0A8" stroke-opacity="0.22" stroke-width="6"/>
    <circle cx="512" cy="512" r="438" fill="none" stroke="#3EF0A8" stroke-opacity="0.09" stroke-width="5"/>
  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="300" fill="url(#disc)"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="url(#shade)"/>
  <circle cx="512" cy="512" r="300" fill="url(#sheen)"/>
  <circle cx="512" cy="512" r="297" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <g fill="none" stroke="#04110B" stroke-width="62" stroke-linecap="round">
    <path d="M598.4 431.4A132 132 0 1 1 425.6 431.4"/>
    <path d="M512 352V508"/>
  </g>
</svg>
